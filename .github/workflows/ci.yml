name: CI
on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:
permissions:
  contents: read
jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux media/capture build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/build.sh deps --yes
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Native UDP/QUIC session tests
        run: cargo test -p janus-session --locked -- --ignored
      - run: cargo run --locked -p janus-cli -- diagnostics self-test
      - run: cargo run --locked -p janus-cli -- diagnostics fixture target/fixtures/flash-impulse
      - run: cargo run --locked -p janus-cli -- diagnostics correlate docs/fixtures/observations.synthetic.json --expected-events 2 --calibration-error-us 1

  desktop:
    name: Desktop lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/build.sh deps --yes
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/janus-app -> ../../target/desktop
          key: desktop
      - run: cargo fmt --manifest-path crates/janus-app/Cargo.toml -- --check
      - run: cargo clippy --manifest-path crates/janus-app/Cargo.toml --target-dir target/desktop --locked -- -D warnings
